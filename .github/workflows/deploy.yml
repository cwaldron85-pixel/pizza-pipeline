name: Full DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  # ---------- SECURITY: PR-LEVEL (shift Left) ----------
  sast-codeql:
    name: Static App Security (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/init@v3

  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ---------- SECURITY: IaC (Terraform) ----------
  security-iac:
    name: IaC Security (Terraform + Checkov)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true

  # ---------- SECURITY: Configuration (Ansible) ----------
  security-ansible:
    name: Configuration Security (Ansible Lint)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Install Ansible + ansible-lint
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip
          pip install ansible-lint

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint .

  # ---------- TEST + BUILD: Application Artifact ----------
  build-app:
    name: Test and Package Flask App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: app
        run: pytest -v

      - name: Archive app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app
          path: app/

  # ---------- DEPLOY: Infra + Config + App ----------
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest
    needs:
      - security-iac
      - security-ansible
      - build-app

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-app
          path: app/

      - name: Create private key file for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labuser.pem
          chmod 600 ~/.ssh/labuser.pem

      - name: Remove previous deployment
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=academy-web" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -n "$INSTANCE_IDS" ]; then
            echo "Terminating previous instance(s): $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
          else
            echo "No previous instance found"
          fi

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=web-sg" \
            --query "SecurityGroups[0].GroupId" --output text)

          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
            echo "Deleting previous security group: $SG_ID"
            aws ec2 delete-security-group --group-id "$SG_ID"
          else
            echo "No previous security group found"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply (secure SSH IP)
        working-directory: terraform
        run: terraform apply -auto-approve -var="my_ip=${{ secrets.MY_IP }}"

      - name: Get EC2 public IP
        id: tf-ip
        working-directory: terraform
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip
          pip install ansible-lint

      - name: Disable host key checking
        run: echo "ANSIBLE_HOST_KEY_CHECKING=False" >> "$GITHUB_ENV"

      - name: Create Ansible inventory
        working-directory: ansible
        run: |
          echo "[web]" > inventory
          echo "${{ steps.tf-ip.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/labuser.pem" >> inventory

      - name: Test SSH connectivity
        run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/labuser.pem ubuntu@${{ steps.tf-ip.outputs.ip }} "echo 'SSH OK'"

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook -i inventory playbook.yml

      - name: Validate Nginx config
        run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/labuser.pem ubuntu@${{ steps.tf-ip.outputs.ip }} "sudo nginx -t"

      - name: Health check (HTTP)
        run: curl -I http://${{ steps.tf-ip.outputs.ip }}

      - name: Fetch app logs
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/labuser.pem ubuntu@${{ steps.tf-ip.outputs.ip }} "sudo journalctl -u pizza-app --no-pager | tail -n 50"
