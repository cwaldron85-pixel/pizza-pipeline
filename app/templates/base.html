<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slice & Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #fdf6ec;
      --char:    #1a1208;
      --tomato:  #c8341a;
      --gold:    #e8a020;
      --warm:    #f0e0c8;
      --muted:   #7a6a58;
      --radius:  12px;
    }

    body {
      background: var(--cream);
      color: var(--char);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--char);
      color: var(--cream);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--gold); font-style: italic; }
    .header-badge {
      background: var(--tomato);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* ── Layout ── */
    main {
      max-width: 860px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: var(--tomato); color: #fff; }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(200,52,26,.35); }
    .btn-secondary { background: var(--char); color: var(--cream); }
    .btn-secondary:hover { box-shadow: 0 4px 16px rgba(26,18,8,.3); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--warm);
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
    }
    .btn-ghost:hover { background: var(--warm); color: var(--char); }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--warm);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Order sidebar strip ── */
    .page-grid { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }
    @media (max-width: 640px) { .page-grid { grid-template-columns: 1fr; } }

    .order-panel {
      background: var(--char);
      color: var(--cream);
      border-radius: var(--radius);
      padding: 1.5rem;
      align-self: start;
      position: sticky;
      top: 1.5rem;
    }
    .order-panel h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    .order-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      align-items: center;
      gap: 0.5rem;
    }
    .order-line:last-of-type { border-bottom: none; }
    .order-total {
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255,255,255,.2);
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }
    .empty-note { font-size: 0.82rem; color: var(--muted); font-style: italic; }
    .order-actions { margin-top: 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; }

    /* ── Section title ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
    }
    .section-title em { color: var(--tomato); font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>Slice <span>&amp;</span> Order</h1>
  <span class="header-badge">🍕 Online Ordering</span>
</header>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
