- name: Deploy Flask Pizza App
  hosts: web
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Python and pip
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Copy application files
      ansible.builtin.copy:
        src: ../app/
        dest: /home/ubuntu/app/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create Python virtual environment
      ansible.builtin.command: python3 -m venv /home/ubuntu/app/venv
      args:
        creates: /home/ubuntu/app/venv

    - name: Install app dependencies into the virtual environment
      ansible.builtin.pip:
        requirements: /home/ubuntu/app/requirements.txt
        virtualenv: /home/ubuntu/app/venv

    - name: Create systemd service for the Flask app
      ansible.builtin.copy:
        dest: /etc/systemd/system/pizza-app.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Pizza App (Gunicorn)
          After=network.target

          [Service]
          ExecStart=/home/ubuntu/app/venv/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 app:app
          Restart=always
          User=ubuntu
          WorkingDirectory=/home/ubuntu/app
          Environment=PORT=5000

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start the Flask app service
      ansible.builtin.systemd:
        name: pizza-app
        enabled: true
        state: restarted

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/pizza-app
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://localhost:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/pizza-app
        dest: /etc/nginx/sites-enabled/pizza-app
        state: link

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
